<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Văn Phòng furuCRM</title >
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: the office scene fills the stage; a glass name plate top-left; view switch docked bottom. Single sunny-day look: sea blue + teal accent, warm coffee orange for the café. */
  :root {
    --bg: #0b2233;
    --ink: #f3f8f8;
    --ink-dim: #a8c1c9;
    --accent: #3fd0c0;
    --warm: #ffb067;
    --plate: rgba(8, 28, 42, 0.74);
    --line: rgba(63, 208, 192, 0.42);
    --f-body: "Be Vietnam Pro", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .plate {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px));
    padding: 10px 16px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--plate); backdrop-filter: blur(8px);
    max-width: calc(100% - 32px);
  }
  .plate h1 { margin: 0; font: 700 21px/1.25 var(--f-body); letter-spacing: -0.01em; text-wrap: balance; }
  .plate h1 span { color: var(--accent); }
  .plate p { margin: 4px 0 0; font: 400 11.5px/1.5 var(--f-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .plate .hint { color: var(--warm); }
  .dock {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 32px);
  }
  .dock button {
    font: 600 13px var(--f-body); color: var(--ink); background: var(--plate); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; backdrop-filter: blur(8px);
  }
  .dock button:hover { border-color: var(--accent); }
  .dock button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .dock button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    font-size: 11.5px; line-height: 1.3; color: var(--ink-dim); padding: 4px 8px; border-radius: 4px;
    background: rgba(8, 28, 42, 0.82); border: 1px solid var(--line);
  }
  .tag b { display: block; font-weight: 600; font-size: 12.5px; color: var(--accent); }
  .tag.warm b { color: var(--warm); }
  .plate .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .plate .row label { font: 600 12px var(--f-body); color: var(--ink-dim); }
  .plate .row input {
    width: 148px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
    background: rgba(6, 20, 32, 0.65); color: var(--ink); font: 700 14px var(--f-body);
  }
  .plate .row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .conn { display: flex; align-items: center; gap: 7px; margin-top: 8px; font: 600 12px var(--f-body); color: var(--ink-dim); }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #8aa4ae; flex: none; }
  .conn.on .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(63, 208, 192, 0.25); }
  .conn.err .dot { background: #e07060; }
  #deskTags, #faces { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .dtag, .who, .facename {
    position: absolute; transform: translate(-50%, -120%); white-space: nowrap;
    font: 700 12.5px var(--f-body); color: var(--ink);
    background: var(--plate); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px;
    backdrop-filter: blur(8px);
  }
  .dtag { pointer-events: auto; cursor: pointer; }
  .dtag b { color: var(--accent); margin-right: 6px; }
  .dtag.hot, .dtag.mine { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .dtag.hot b, .dtag.mine b { color: var(--bg); }
  .who, .facename { pointer-events: none; padding: 3px 8px; font-size: 12px; }
  .who.me { border-color: var(--accent); }
  .dock button.talk { background: #164e56; border-color: var(--accent); }
  .dock button.off { background: #8a3b32; border-color: #e07060; }
  .dock button.leave { color: #ffc2b8; border-color: rgba(224, 112, 96, 0.75); }
  #selfWrap {
    position: fixed; z-index: 6; display: none;
    left: max(16px, env(safe-area-inset-left));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    width: 112px; height: 148px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); background: #10202a; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  }
  body.in-room #selfWrap { display: block; }
  #selfWrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #000; }
  #selfWrap.cam-off video { visibility: hidden; }
  #selfWrap .ph {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font: 800 28px var(--f-body); color: #fff; background: #164e56;
  }
  #selfWrap.cam-off .ph { display: flex; }
  #selfWrap span {
    position: absolute; left: 6px; bottom: 6px; font: 800 11px var(--f-body);
    background: rgba(8, 28, 42, 0.78); color: var(--ink); padding: 2px 7px; border-radius: 999px;
  }
  .chat {
    position: fixed; z-index: 7; top: 16px; right: max(16px, env(safe-area-inset-right));
    width: min(320px, calc(100vw - 28px)); height: min(420px, calc(100vh - 120px));
    display: none; flex-direction: column;
    background: var(--plate); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px); overflow: hidden;
  }
  body.in-room.chat-open .chat { display: flex; }
  .chat h3 { margin: 0; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .chat .msgs { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .msg .who-name { font-weight: 800; color: var(--accent); }
  .msg.sys { text-align: center; color: var(--ink-dim); font-size: 12.5px; }
  .chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .chat input {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(6, 20, 32, 0.65); color: var(--ink); padding: 8px 10px; font: 600 14px var(--f-body);
  }
  .chat form button { border: none; border-radius: 8px; background: var(--accent); color: var(--bg); font: 800 13px var(--f-body); padding: 8px 12px; cursor: pointer; }
  #toast {
    position: fixed; z-index: 30; left: 50%; bottom: 78px; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg); font: 700 13.5px var(--f-body);
    padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: 0.25s ease;
    max-width: min(92vw, 460px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .plate, .dock { z-index: 6; }
  #btnChat { position: relative; }
  #btnChat.has-note::after {
    content: attr(data-n); position: absolute; top: -7px; right: -2px;
    min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    border-radius: 999px; background: #e07060; color: #fff; font-size: 11px; line-height: 18px;
  }
  @media (max-width: 720px) {
    .chat { top: auto; bottom: 74px; height: min(46vh, 340px); }
    #selfWrap { width: 84px; height: 112px; }
    .dock { flex-wrap: nowrap; justify-content: flex-start; width: calc(100% - 16px); max-width: calc(100% - 16px); overflow-x: auto; }
    .dock button { flex: none; }
  }
  #err { position: fixed; inset: auto 16px 50% 16px; text-align: center; }
</style>

<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Units: 1 = 1 m. Floor top at y = 0 (3rd floor). Sea lies toward −Z, beach 12 m below.
const canvas = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById('err').hidden = false; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc7dfec, 140, 650);
const persp = new THREE.PerspectiveCamera(45, 1, 0.1, 900);
persp.position.set(-17, 14, -24);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
ortho.position.set(0, 60, -1); ortho.up.set(0, 0, -1); ortho.lookAt(0, 0, -1);
let camera = persp;
const controls = new OrbitControls(persp, canvas);
controls.target.set(0, 0, 0); controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 1; controls.maxDistance = 90;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(17);
const pick = arr => arr[Math.floor(rng() * arr.length)];
const T = { value: 0 };

// ---------- sky: clear tropical day ----------
const SUN_DIR = new THREE.Vector3(-0.35, 0.52, -0.8).normalize();
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR }, uT: T },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    varying vec3 vD; uniform vec3 uSun; uniform float uT;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }
    void main(){
      float y = max(vD.y, 0.0);
      vec3 hor = vec3(0.80,0.89,0.94), top = vec3(0.18,0.47,0.84);
      vec3 c = mix(hor, top, smoothstep(0.0, 0.5, y));
      float s = max(dot(vD, uSun), 0.0);
      c += vec3(1.0,0.93,0.78) * pow(s, 48.0) * 0.45 + vec3(1.0) * smoothstep(0.9988, 0.9995, s) * 2.0;
      vec2 cp = vD.xz / max(vD.y, 0.06) * 1.6 + vec2(uT*0.01, 0.0);
      float cl = smoothstep(0.55, 0.85, fbm(cp)) * smoothstep(0.02, 0.15, y);
      c = mix(c, vec3(1.0), cl * 0.85);
      if (vD.y < 0.0) c = vec3(0.55,0.72,0.8);
      gl_FragColor = vec4(c, 1.0);
    }`,
})));

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xd6ecff, 0x8a7a66, 0.55));
const sunL = new THREE.DirectionalLight(0xfff0d8, 2.1);
sunL.position.copy(SUN_DIR).multiplyScalar(60); sunL.target.position.set(0, 0, -1);
scene.add(sunL.target);
sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048);
Object.assign(sunL.shadow.camera, { left: -18, right: 18, top: 16, bottom: -16, near: 1, far: 160 });
sunL.shadow.bias = -0.0004; sunL.shadow.normalBias = 0.02;
scene.add(sunL);

// ---------- textures ----------
function canvasTex(w, h, draw, name = '') {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.name = name; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const rr = (a, b) => a + rng() * (b - a);
const oakTex = canvasTex(512, 512, (g, w, h) => {
  const rows = 8;
  for (let r = 0; r < rows; r++) {
    const y = r * h / rows, b = rr(200, 222);
    g.fillStyle = `rgb(${b},${b - 28},${b - 62})`; g.fillRect(0, y, w, h / rows);
    for (let k = 0; k < 30; k++) { g.strokeStyle = `rgba(120,80,40,${rr(0.04, 0.1)})`; g.beginPath(); const yy = y + rr(2, h / rows - 2); g.moveTo(0, yy); g.bezierCurveTo(w * .3, yy + rr(-3, 3), w * .6, yy + rr(-3, 3), w, yy); g.stroke(); }
    g.fillStyle = 'rgba(90,60,30,0.45)'; g.fillRect(0, y, w, 2); g.fillRect(rr(0.2, 0.8) * w, y, 2, h / rows);
  }
}, 'oak');
oakTex.wrapS = oakTex.wrapT = THREE.RepeatWrapping; oakTex.repeat.set(9, 5.5);
const teakTex = oakTex.clone(); teakTex.repeat.set(9, 1);
const sandTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e3cfa6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${rr(150, 255)},${rr(130, 230)},${rr(90, 180)},0.3)`; g.fillRect(rr(0, w), rr(0, h), 1.5, 1.5); }
}, 'sand');
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(60, 25);
const facadeTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#eef1f0'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    g.fillStyle = (r + c) % 3 ? '#7fb3c8' : '#9cc7d6'; g.fillRect(c * 64 + 6, r * 64 + 10, 52, 40);
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(c * 64 + 6, r * 64 + 10, 52, 6);
  }
}, 'facade');
facadeTex.wrapS = facadeTex.wrapT = THREE.RepeatWrapping; facadeTex.repeat.set(7, 3);
function codeTex(seed) {
  const r = mulberry32(seed);
  return canvasTex(256, 160, (g, w, h) => {
    g.fillStyle = '#131e29'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#1f2e3c'; g.fillRect(0, 0, w, 12); g.fillRect(0, 12, 34, h);
    const cols = ['#7fd6c8', '#ffb067', '#9ab8ff', '#e6edf0', '#ff7a90', '#c3e88d'];
    let y = 20, ln = 1;
    while (y < h - 6) {
      g.fillStyle = '#44586a'; g.fillRect(8, y, 14, 4);
      let x = 42 + Math.floor(r() * 4) * 10; const n = 1 + Math.floor(r() * 4);
      for (let i = 0; i < n; i++) { const len = 10 + r() * 46; g.fillStyle = cols[Math.floor(r() * cols.length)]; g.fillRect(x, y, len, 4); x += len + 6; if (x > w - 12) break; }
      y += 9; ln++;
    }
  }, 'code' + seed);
}
const codeTexes = [1, 2, 3, 4, 5].map(codeTex);
const screenMats = codeTexes.map(t => new THREE.MeshBasicMaterial({ map: t }));
const burndownTex = canvasTex(512, 288, (g, w, h) => {
  g.fillStyle = '#131e29'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e6edf0'; g.font = '600 22px sans-serif'; g.fillText('Sprint 24 · Burndown', 24, 38);
  g.strokeStyle = '#2c3e4f'; g.lineWidth = 1;
  for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(40, 70 + i * 45); g.lineTo(w - 24, 70 + i * 45); g.stroke(); }
  g.strokeStyle = '#4c6275'; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(40, 70); g.lineTo(w - 24, 250); g.stroke(); g.setLineDash([]);
  g.strokeStyle = '#3fd0c0'; g.lineWidth = 4; g.beginPath();
  const pts = [70, 82, 95, 120, 128, 150, 178, 190, 214];
  pts.forEach((v, i) => { const x = 40 + i * 50; i ? g.lineTo(x, v) : g.moveTo(x, v); }); g.stroke();
  g.fillStyle = '#ffb067'; g.beginPath(); g.arc(40 + 8 * 50, 214, 6, 0, 7); g.fill();
}, 'burndown');
const coffeeSignTex = canvasTex(512, 160, (g, w, h) => {
  g.fillStyle = '#1d3a3a'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffb067'; g.font = '700 64px sans-serif'; g.textAlign = 'center'; g.fillText('CÀ PHÊ', w / 2, 82);
  g.fillStyle = '#e6edf0'; g.font = '400 26px monospace'; g.fillText('espresso · bạc xỉu · 7:30–18:00', w / 2, 128);
}, 'coffee_sign');
function paintDevSign(g, w, h, logo) {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#f6f8f7'; g.fillRect(0, 0, w, h);
  const title = 'furuCRM';
  const tag = "Let's dream with us!";
  g.font = '700 78px monospace';
  const titleW = g.measureText(title).width;
  g.font = '400 28px sans-serif';
  const textW = Math.max(titleW, g.measureText(tag).width);
  const logoSize = logo ? Math.round(h * 0.72) : 0;
  const gap = logo ? Math.round(h * 0.1) : 0;
  let x = (w - logoSize - gap - textW) / 2;
  const mid = h / 2;
  if (logo) {
    const c = document.createElement('canvas');
    c.width = logo.naturalWidth; c.height = logo.naturalHeight;
    const cg = c.getContext('2d');
    cg.drawImage(logo, 0, 0);
    const img = cg.getImageData(0, 0, c.width, c.height);
    const px = img.data;

      vec4 w = modelMatrix * vec4(p,1.); vW = w.xyz;
      vec4 mvPosition = viewMatrix * w;

    }`,
  fragmentShader: `
    uniform float uT; uniform vec3 uSun; uniform float uShore; varying vec3 vW;
    #include <fog_pars_fragment>
    float n(vec2 p){ return sin(p.x)*sin(p.y); }
    void main(){
      vec3 V = normalize(cameraPosition - vW);
      vec2 q = vW.xz;
      vec3 N = normalize(vec3(0.1*cos(q.x*0.12+uT*0.8) + 0.07*n(q*1.3+uT) + 0.03*n(q*4.1-uT*1.7), 1.0,
                              0.12*cos(q.y*0.21-uT*1.1) + 0.07*n(q.yx*1.7-uT) + 0.03*n(q.yx*3.7+uT*1.3)));

      float d = clamp((uShore - vW.z) / 40.0, 0.0, 1.0);

      vec3 R = reflect(-V, N);
      c += vec3(1.0,0.95,0.85) * pow(max(dot(R, uSun), 0.0), 220.0) * 2.4;
      float dist = vW.z - uShore, foam = 0.0;
      for (int i = 0; i < 3; i++) {
        float f = float(i), pos = -mod(uT*0.5 + f*1.4, 4.2);
        foam += smoothstep(0.45, 0.0, abs(dist - pos - sin(vW.x*0.3+f)*0.4)) * (1.0 - (-pos)/4.2);

      c = mix(c, vec3(0.97,0.98,0.96), clamp(foam, 0.0, 1.0) * 0.85);

      #include <fog_fragment>

function handleData(pid, m) {
  if (!m || typeof m !== 'object') return;
  const entry = getEntry(pid);
  if (m.kind === 'hello') {
    const isNew = !entry.greeted;
    entry.name = String(m.name || 'Bạn').slice(0, 24);
    entry.micOn = m.mic !== false;
    entry.camOn = m.cam !== false;
    entry.greeted = true;
    if (isNew) { sysMsg(entry.name + ' đã vào đảo.'); toast(entry.name + ' đã vào đảo.'); }
    refreshScreens();
    refreshConnText();
  } else if (m.kind === 'msg' && m.text) {
    onChat({ kind: 'msg', from: pid, name: entry.name, text: String(m.text).slice(0, 300) });
  } else if (m.kind === 'state') {
    entry.micOn = m.mic !== false;
    entry.camOn = m.cam !== false;
    refreshScreens();
  } else if (m.kind === 'bye') removePeer(pid, true);
}
function sendTo(entry, obj) {
  try { if (entry.conn && entry.conn.open) entry.conn.send(obj); } catch (e) {}
}
function broadcast(obj) {
  Object.keys(peers).forEach((id) => sendTo(peers[id], obj));
}
function removePeer(slot, announce) {
  const entry = peers[slot];
  if (!entry) return;
  delete peers[slot];
  try { if (entry.conn) entry.conn.close(); } catch (e) {}
  try { if (entry.call) entry.call.close(); } catch (e) {}
  if (myIsland > 0) {
    if (announce && entry.greeted) { sysMsg(entry.name + ' đã rời đảo.'); toast(entry.name + ' đã rời đảo.'); }
    refreshScreens();
    refreshConnText();
  }
}

const FLOOR_ID = 'furuoffice-floor';
let floorGen = 0;
let floorPeer = null;
let floorHost = false;
let floorLink = null;
let floorConns = [];
function sendPresence(msg) {
  if (floorHost) { applyPresence(msg, true); return; }
  if (floorLink && floorLink.open) floorLink.send(msg);
  else pendingPresence = msg;
}
function notePeer(who) {
  if (!who || who.id === myId || who.table !== myIsland || !who.peerId || !myPeer) return;
  dial(String(who.peerId), 0);
}
function applyPresence(msg, relay) {
  if (!msg) return;
  if (msg.kind === 'here' && msg.who) {
    upsertSeat(msg.who);
    if (relay) broadcastFloor(msg);
    notePeer(msg.who);
    refreshScreens();
  } else if (msg.kind === 'gone' && msg.id) {
    if (msg.id === myId && myIsland > 0) return;
    removeSeat(msg.id);
    if (relay) broadcastFloor(msg);
    refreshScreens();
  } else if (msg.kind === 'roster' && Array.isArray(msg.people)) {
    const keep = new Set(msg.people.map((p) => p.id));
    [...people.keys()].forEach((id) => { if (id !== myId && !keep.has(id)) removeSeat(id); });
    msg.people.forEach((p) => { upsertSeat(p); notePeer(p); });
    refreshScreens();
  }
}
function broadcastFloor(msg) {
  floorConns.forEach((c) => { try { if (c.open) c.send(msg); } catch (e) {} });
}
function onFloorData(msg, from) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.kind === 'here' && msg.who && floorHost) {
    if (from) from.whoId = msg.who.id;
    applyPresence(msg, true);
    return;
  }
  if (msg.kind === 'gone' && floorHost) { applyPresence(msg, true); return; }
  if (!floorHost && (msg.kind === 'here' || msg.kind === 'gone' || msg.kind === 'roster')) applyPresence(msg, false);
}
function destroyFloor() {
  try { if (floorPeer) floorPeer.destroy(); } catch (e) {}
  floorPeer = null;
  floorLink = null;
  floorHost = false;
  floorConns = [];
}
function claimFloor() {
  const gen = ++floorGen;
  destroyFloor();
  iceServers().then((ice) => {
    if (gen !== floorGen) return;
    let p;
    try { p = new Peer(FLOOR_ID, { config: { iceServers: ice, sdpSemantics: 'unified-plan' }, secure: true }); }
    catch (e) { joinFloor(gen); return; }
    let settled = false;
    const giveUp = () => {
      if (settled || gen !== floorGen) return;
      settled = true;
      try { p.destroy(); } catch (e) {}
      joinFloor(gen);
    };
    const to = setTimeout(giveUp, 8000);
    p.on('open', () => {
      if (gen !== floorGen) { try { p.destroy(); } catch (e) {} return; }
      settled = true;
      clearTimeout(to);
      floorPeer = p;
      floorHost = true;
      p.on('connection', (conn) => {
        floorConns.push(conn);
        conn.on('open', () => { conn.send({ kind: 'roster', people: rosterList() }); });
        conn.on('data', (msg) => onFloorData(msg, conn));
        conn.on('close', () => {
          floorConns = floorConns.filter((c) => c !== conn);
          if (conn.whoId && conn.whoId !== myId && !floorConns.some((c) => c.whoId === conn.whoId)) {
            removeSeat(conn.whoId);
            broadcastFloor({ kind: 'gone', id: conn.whoId });
          }
        });
      });
      p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
      if (myPresence) broadcastFloor({ kind: 'here', who: myPresence });
    });
    p.on('error', (err) => {
      if (gen !== floorGen || settled) return;
      const type = err && err.type;
      if (type === 'unavailable-id' || type === 'network' || type === 'server-error' || type === 'socket-error') giveUp();
    });
  });
}
function joinFloor(gen) {
  if (gen !== floorGen) return;
  iceServers().then((ice) => {
    if (gen !== floorGen) return;
    const p = new Peer(undefined, { config: { iceServers: ice, sdpSemantics: 'unified-plan' }, secure: true });
    floorPeer = p;
    p.on('open', () => {
      if (gen !== floorGen) { try { p.destroy(); } catch (e) {} return; }
      const conn = p.connect(FLOOR_ID, { reliable: true });
      floorLink = conn;
      conn.on('open', () => {
        const msg = pendingPresence || (myPresence ? { kind: 'here', who: myPresence } : null);
        pendingPresence = null;
        if (msg) conn.send(msg);
      });
      conn.on('data', (msg) => onFloorData(msg, null));
      conn.on('close', () => { if (gen === floorGen) setTimeout(claimFloor, 800); });
    });
    p.on('error', (err) => {
      if (gen !== floorGen) return;
      if (err && err.type === 'peer-unavailable') setTimeout(claimFloor, 900);
    });
  });
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || myIsland !== 0) { down = null; return; }
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  down = null;
  if (dx * dx + dy * dy > 36) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickers, false)[0];
  if (hit) joinDesk(hit.object.userData.island, hit.object.userData.slot);
});
canvas.addEventListener('pointermove', (e) => {
  if (myIsland !== 0) { hoveredIsland = -1; ring.visible = false; canvas.style.cursor = ''; return; }
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickers, false)[0];
  hoveredIsland = hit ? hit.object.userData.island : -1;
  canvas.style.cursor = hit ? 'pointer' : '';
  if (hit) {
    const seat = islands[hit.object.userData.island].seats[hit.object.userData.slot];
    ring.visible = true;
    ring.position.set(seat.x, 0.04, seat.z);
  } else ring.visible = false;
});

$('btnTalk').addEventListener('click', startVoice);
$('btnHear').addEventListener('click', () => {
  unlockAudio();
  let pending = 0;
  remoteAudio.forEach((audio) => {
    pending++;
    const goPlay = audio.play();
    if (goPlay && goPlay.then) goPlay.then(() => { if (--pending === 0) $('btnHear').hidden = true; }).catch(() => {});
    else pending--;
  });
  if (!remoteAudio.size) $('btnHear').hidden = true;
});
$('btnMic').addEventListener('click', () => {
  if (!localStream || !localStream.getAudioTracks().length) { startVoice(); return; }
  micOn = !micOn;
  localStream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
  syncControlButtons();
  refreshScreens();
  broadcast({ kind: 'state', mic: micOn, cam: camOn });
});
$('btnCam').addEventListener('click', () => {
  if (camOn) {
    camOn = false;
    if (localStream) localStream.getVideoTracks().forEach((t) => { t.enabled = false; });
    syncControlButtons();
    updateSelf();
    broadcast({ kind: 'state', mic: micOn, cam: camOn });
    return;
  }
  ensureVideo().then((ok) => {
    camOn = ok;
    if (!ok) toast('Chưa bật được camera. Hãy cho phép camera rồi bấm lại.', 4600);
    syncControlButtons();
    updateSelf();
    broadcast({ kind: 'state', mic: micOn, cam: camOn });
  }).catch(() => {
    camOn = false;
    toast('Trình duyệt đang chặn camera. Mở quyền camera cho trang này.', 4800);
    syncControlButtons();
  });
});
$('btnLeave').addEventListener('click', () => leaveDesk(false));
$('btnChat').addEventListener('click', () => {
  document.body.classList.toggle('chat-open');
  if (document.body.classList.contains('chat-open')) clearChatNote();
});
$('chatForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('chatInput').value.trim();
  if (!v || myIsland === 0) return;
  onChat({ kind: 'msg', from: myId, name: myName(), text: v.slice(0, 300) });
  broadcast({ kind: 'msg', text: v.slice(0, 300) });
  $('chatInput').value = '';
});
try {
  const saved = localStorage.getItem('furu-office-name');
  if (saved) $('nameInput').value = saved;
} catch (e) {}
$('nameInput').addEventListener('change', () => {
  try { localStorage.setItem('furu-office-name', $('nameInput').value.trim()); } catch (e) {}
  updateSelf();
  if (myIsland > 0) {
    broadcast({ kind: 'hello', name: myName(), mic: micOn, cam: camOn });
    announceSeat();
  }
});
addEventListener('beforeunload', () => {
  if (myIsland > 0) {
    const msg = { kind: 'gone', id: myId };
    try {
      if (floorHost) broadcastFloor(msg);
      else if (floorLink && floorLink.open) floorLink.send(msg);
    } catch (e) {}
  }
  if (localStream) localStream.getTracks().forEach((tr) => tr.stop());
});
loadPeerLib().then((ok) => { if (ok) claimFloor(); });


// ---------- loop ----------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  T.value += dt; seaMat.uniforms.uT.value = T.value;
  boat.position.x = -60 + ((T.value * 1.2) % 140); boat.rotation.z = Math.sin(T.value * 0.9) * 0.04;
  rackMats.forEach((m, i) => { m.emissiveIntensity = 1.0 + 0.35 * Math.sin(T.value * (5 + i) + i); });

  if (tween) {
    tween.s = Math.min(1, tween.s + dt / 1.4);
    const e = tween.s < 0.5 ? 4 * tween.s ** 3 : 1 - (-2 * tween.s + 2) ** 3 / 2;
    persp.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.s >= 1) {
      const sit = tween.sit;
      tween = null;
      if (sit) {
        controls.enabled = true;
        controls.minDistance = 0.8;
        controls.maxDistance = 3.4;
        controls.maxPolarAngle = Math.PI * 0.62;
      }
    }
  }
  if (camera === persp && !tween) controls.update();
  else if (camera !== persp) {
    const w = innerWidth, h = innerHeight;
    for (const t of tags) {
      tmp.copy(t.v).project(ortho);
      t.el.style.left = `${(tmp.x * 0.5 + 0.5) * w}px`; t.el.style.top = `${(-tmp.y * 0.5 + 0.5) * h}px`;
    }
  }
  placeOffice();
  renderer.render(scene, camera);
});
</script>
